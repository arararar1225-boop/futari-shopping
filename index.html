<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8faf8"><title>ふたりの買い物リスト</title><link rel="manifest" href="manifest.webmanifest"><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f8faf8;color:#203029;margin:0}main{max-width:560px;margin:auto;padding:24px 18px 80px}h1{font-size:24px}h2{font-size:17px;margin-top:28px}.sub,.muted{color:#718078;font-size:13px}.panel{background:white;border:1px solid #e2e9e4;border-radius:16px;padding:16px;margin:16px 0}input,button{font:inherit;border-radius:10px;padding:12px;border:1px solid #d9e2db;box-sizing:border-box}input{width:100%;background:white}button{background:#287a56;color:white;border:0;cursor:pointer}button.secondary{background:#edf3ef;color:#28533d}button.small{padding:7px 10px;font-size:13px}.line{display:flex;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid #edf1ed}.line:last-child{border:0}.line input{width:22px;height:22px;accent-color:#287a56}.line label{flex:1}.done label{text-decoration:line-through;color:#8c9990}.qty{font-size:13px;color:#839087}.row{display:flex;gap:8px}.row input{flex:1;min-width:0}.hidden{display:none}.status{font-size:13px;color:#6e7d73}a{color:#287a56}</style></head><body><main><h1>🛒 ふたりの買い物リスト</h1><div class="sub">買ったものは24時間後に非表示</div><div class="panel"><div id="setup"><b>共有リストの接続設定</b><p class="muted">Firebaseプロジェクトを用意し、Webアプリの設定値を入力してください。設定はこの端末にのみ保存されます。</p><textarea id="config" style="width:100%;height:110px" placeholder='Firebase config の JSON（apiKey, authDomain, projectId, appId など）'></textarea><p><input id="room" placeholder="夫婦専用の共有コード（長めのランダムな文字列）"></p><button id="connect">接続する</button><p id="setupError" class="status"></p></div><div id="login" class="hidden"><b>ログイン</b><p><input id="email" type="email" placeholder="メールアドレス" autocomplete="username"></p><p><input id="password" type="password" placeholder="パスワード" autocomplete="current-password"></p><button id="signIn">ログインする</button><p id="loginError" class="status"></p></div><div id="app" class="hidden"><form id="add"><input id="item" placeholder="買うものを入力" required maxlength="80"><div class="row" style="margin-top:8px"><input id="quantity" placeholder="数量（例：2個）" maxlength="30"><button>＋ 追加</button></div></form><p id="status" class="status">接続中...</p><h2>買うもの <span id="count"></span></h2><div id="pending"></div><h2>購入済み（24時間表示）</h2><div id="recent"></div><button class="secondary small" id="toggleHistory" style="margin-top:20px">購入履歴を表示</button><div id="history" class="hidden"></div><p><button class="secondary small" id="reset">接続設定を変更</button></p></div></div><p class="muted">Firestoreのルールで、登録した夫婦2人のUIDだけに読み書きを許可してください。共有コードだけではアクセス制限になりません。</p></main><script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';import{getAuth,signInWithEmailAndPassword,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';import{getFirestore,collection,addDoc,doc,updateDoc,deleteDoc,onSnapshot,serverTimestamp,query,orderBy}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
const $=id=>document.getElementById(id), DAY=86400000;let db,coll,unsub,records=[],auth,roomKey;const saved=JSON.parse(localStorage.getItem('shopping-settings')||'null');if(saved){$('config').value=JSON.stringify(saved.config);$('room').value=saved.room;}function error(e){$('status').textContent='エラー: '+e.message;console.error(e)}function safe(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function row(r,archived=false){const div=document.createElement('div');div.className='line'+(r.boughtAt?' done':'');const check=document.createElement('input');check.type='checkbox';check.checked=!!r.boughtAt;check.setAttribute('aria-label',r.name+'を購入済みにする');check.onchange=async()=>{try{await updateDoc(doc(coll,r.id),{boughtAt:check.checked?Date.now():null})}catch(e){error(e)}};const label=document.createElement('label');label.textContent=r.name;const qty=document.createElement('span');qty.className='qty';qty.textContent=r.qty||'';const del=document.createElement('button');del.className='secondary small';del.textContent='削除';del.onclick=async()=>{if(confirm('この商品を削除しますか？'))try{await deleteDoc(doc(coll,r.id))}catch(e){error(e)}};div.append(check,label,qty,del);return div}function render(){const now=Date.now();const pending=records.filter(r=>!r.boughtAt);const recent=records.filter(r=>r.boughtAt&&now-r.boughtAt<DAY);const history=records.filter(r=>r.boughtAt&&now-r.boughtAt>=DAY);$('count').textContent=`(${pending.length})`;for(const [id,data]of [['pending',pending],['recent',recent],['history',history]]){$(id).replaceChildren(...data.map(r=>row(r)));if(!data.length){const p=document.createElement('p');p.className='muted';p.textContent=id==='pending'?'買うものはありません':'該当する商品はありません';$(id).append(p)}}}async function connect(){try{const config=JSON.parse($('config').value);const room=$('room').value.trim();if(!/^[a-zA-Z0-9_-]{16,100}$/.test(room))throw Error('共有コードは英数字・_-で16〜100文字にしてください');const app=initializeApp(config);auth=getAuth(app);db=getFirestore(app);roomKey=room;localStorage.setItem('shopping-settings',JSON.stringify({config,room}));$('setup').classList.add('hidden');$('login').classList.remove('hidden');onAuthStateChanged(auth,user=>{if(user){$('login').classList.add('hidden');$('app').classList.remove('hidden');coll=collection(db,'shoppingLists',roomKey,'items');if(unsub)unsub();unsub=onSnapshot(coll,snap=>{records=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.createdAtMs||0)-(b.createdAtMs||0));$('status').textContent='● 共有リストに接続中';render()},error);render()}else{$('login').classList.remove('hidden');$('app').classList.add('hidden')}});setInterval(render,60000)}catch(e){$('setupError').textContent=e.message}}$('connect').onclick=connect;$('signIn').onclick=async()=>{try{$('loginError').textContent='';await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value)}catch(e){$('loginError').textContent='ログインできません: '+e.code}};$('add').onsubmit=async e=>{e.preventDefault();const name=$('item').value.trim();if(!name)return;try{await addDoc(coll,{name,qty:$('quantity').value.trim(),boughtAt:null,createdAtMs:Date.now(),createdAt:serverTimestamp()});$('item').value='';$('quantity').value=''}catch(e){error(e)}};$('toggleHistory').onclick=()=>{$('history').classList.toggle('hidden');$('toggleHistory').textContent=$('history').classList.contains('hidden')?'購入履歴を表示':'購入履歴を閉じる'};$('reset').onclick=()=>{localStorage.removeItem('shopping-settings');location.reload()};if(saved)connect();
</script></body></html>
