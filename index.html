<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8faf8"><title>ふたりの買い物リスト</title><link rel="manifest" href="manifest.webmanifest"><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f8faf8;color:#203029;margin:0}main{max-width:560px;margin:auto;padding:24px 18px 80px}h1{font-size:24px}h2{font-size:17px;margin-top:28px}.sub,.muted{color:#718078;font-size:13px}.panel{background:white;border:1px solid #e2e9e4;border-radius:16px;padding:16px;margin:16px 0}input,button{font:inherit;border-radius:10px;padding:12px;border:1px solid #d9e2db;box-sizing:border-box}input{width:100%;background:white}button{background:#287a56;color:white;border:0;cursor:pointer}button.secondary{background:#edf3ef;color:#28533d}button.small{padding:7px 10px;font-size:13px}.line{display:flex;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid #edf1ed}.line:last-child{border:0}.line input{width:22px;height:22px;accent-color:#287a56}.line label{flex:1}.done label{text-decoration:line-through;color:#8c9990}.qty{font-size:13px;color:#839087}.row{display:flex;gap:8px}.row input{flex:1;min-width:0}.hidden{display:none}.status{font-size:13px;color:#6e7d73}.progress{margin:0 0 18px;padding:14px;background:#f0f7f2;border-radius:12px}.progress-top{display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:600;font-size:14px}.progress-track{height:10px;background:#d9e6dd;border-radius:99px;overflow:hidden;margin:11px 0 8px}.progress-fill{background:#287a56;width:0;height:100%;border-radius:99px;transition:width .25s}.progress-note{font-size:12px;color:#6e7d73}a{color:#287a56}.flyer-link{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;border:1px solid #c8dbcd;border-radius:12px;padding:14px 15px;margin:0 0 10px;color:#205c3b;font-weight:650;text-decoration:none}.flyer-link:active{background:#ecf5ef}.flyer-sub{font-size:12px;font-weight:400;color:#718078;margin-top:3px}.page-header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 10px}.page-header h1{font-size:clamp(17px,4.2vw,24px);line-height:1.3;margin:0;min-width:0;flex:1}.flyer-nav{display:flex;align-items:center;gap:5px;flex-shrink:0}.flyer-nav a{display:inline-flex;align-items:center;gap:2px;padding:9px 7px;border-radius:9px;background:#e7f1ea;color:#205c3b;border:1px solid #c8dbcd;font-size:12px;font-weight:650;white-space:nowrap;text-decoration:none;min-height:24px}.flyer-nav a:active{background:#d5e8db}.flyer-nav a span{font-size:10px;opacity:.7}@media(max-width:375px){.page-header h1{font-size:16px}.flyer-nav a{font-size:11px;padding:8px 5px}.flyer-nav{gap:4px}}.bottom-actions{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:24px}.settings-corner{display:flex;justify-content:flex-start;margin:0}.settings-corner button{background:transparent;color:#89978d;border:0;padding:6px 2px;font-size:10px;font-weight:400;text-decoration:underline;text-underline-offset:3px;opacity:.78} .settings-corner button:focus-visible{outline:2px solid #287a56;outline-offset:3px}.quick-title{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:19px 0 9px;font-size:14px;font-weight:700}.quick-list{display:flex;flex-wrap:wrap;gap:7px}.quick-btn{padding:9px 11px;background:#e8f2ec;color:#205c3b;border:1px solid #c6dfce;font-size:14px;font-weight:600}.quick-btn:disabled{opacity:.5}.quick-manager{display:flex;gap:8px;margin-top:9px}.quick-manager input{flex:1;min-width:0}.favorite-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid #eee}.favorite-row button{padding:6px 9px}.line{gap:7px}.line label{overflow-wrap:anywhere;min-width:0}.line .mini-action{padding:6px 8px;font-size:12px;background:#edf3ef;color:#28533d}.line .fav-action{padding:6px;font-size:19px;background:transparent;color:#ae9140}.undo-toast{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 16px);left:50%;transform:translateX(-50%);width:min(90vw,480px);box-sizing:border-box;background:#223d30;color:white;border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:12px;justify-content:space-between;box-shadow:0 6px 25px #152c2240;z-index:20}.undo-toast.hidden{display:none}.undo-toast button{background:#fff;color:#205c3b;padding:8px 12px;font-weight:700;flex-shrink:0}.edit-dialog{border:1px solid #cbd9ce;border-radius:15px;padding:18px;max-width:calc(100vw - 50px);width:360px}.edit-dialog::backdrop{background:#15271a88}.edit-dialog input{margin:6px 0 12px}.edit-buttons{display:flex;gap:8px;justify-content:flex-end}.edit-buttons button{padding:9px 12px}@media(max-width:400px){.line{gap:5px}.line .mini-action{padding:6px}.line .qty{max-width:65px;overflow-wrap:anywhere}}</style></head><body><main><div class="page-header"><h1>🛒 ふたりの買い物リスト</h1><nav class="flyer-nav" aria-label="スーパーのチラシ"><a href="https://www.harashinnarus.jp/shops/toyosaka/" target="_blank" rel="noopener noreferrer" aria-label="原信 豊栄店のチラシを見る">原信<span aria-hidden="true">↗</span></a><a href="https://www.uoroku.co.jp/shop/flyer/toyosaka.html" target="_blank" rel="noopener noreferrer" aria-label="ウオロク 豊栄店のチラシを見る">ウオロク<span aria-hidden="true">↗</span></a></nav></div><div class="sub">買ったものは24時間後に非表示</div><div class="panel"><div id="setup"><b>共有リストの接続設定</b><p class="muted">Firebaseプロジェクトを用意し、Webアプリの設定値を入力してください。設定はこの端末にのみ保存されます。</p><textarea id="config" style="width:100%;height:110px" placeholder='Firebase config の JSON（apiKey, authDomain, projectId, appId など）'></textarea><p><input id="room" placeholder="夫婦専用の共有コード（長めのランダムな文字列）"></p><button id="connect">接続する</button><p id="setupError" class="status"></p></div><div id="login" class="hidden"><b>ログイン</b><p><input id="email" type="email" placeholder="メールアドレス" autocomplete="username"></p><p><input id="password" type="password" placeholder="パスワード" autocomplete="current-password"></p><button id="signIn">ログインする</button><p id="loginError" class="status"></p></div><div id="app" class="hidden"><div class="progress" aria-label="買い物進捗"><div class="progress-top"><span>買い物の進捗</span><span id="progressPercent">0%</span></div><div class="progress-track"><div class="progress-fill" id="progressFill" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div></div><div class="progress-note" id="progressDetail">買い物リストを読み込み中</div></div><div class="quick-title"><span>⭐ よく買うもの</span><button type="button" class="secondary small" id="manageFav">編集</button></div><div id="quickList" class="quick-list"><span class="muted">読み込み中...</span></div><div id="favManager" class="hidden"><div class="quick-manager"><input id="newFav" placeholder="定番の商品名を登録" maxlength="80"><button type="button" id="addFav" class="small">登録</button></div><div id="favoriteRows"></div></div><form id="add"><input id="item" placeholder="買うものを入力" required maxlength="80"><div class="row" style="margin-top:8px"><input id="quantity" placeholder="数量（例：2個）" maxlength="30"><button>＋ 追加</button></div></form><p id="status" class="status">接続中...</p><h2>買うもの <span id="count"></span></h2><div id="pending"></div><h2>購入済み（24時間表示）</h2><div id="recent"></div><div class="bottom-actions"><div class="settings-corner"><button type="button" id="reset" aria-label="接続設定を変更">接続設定を変更</button></div><button class="secondary small" id="toggleHistory" type="button">購入履歴を表示</button></div><div id="history" class="hidden"></div></div></div><div id="undoToast" class="undo-toast hidden" role="status" aria-live="polite"><span id="undoText">操作しました</span><button id="undoButton" type="button">元に戻す</button></div><dialog id="editDialog" class="edit-dialog"><form id="editForm"><b>商品を編集</b><p class="muted">商品名と数量を変更できます</p><label>商品名<input id="editName" required maxlength="80"></label><label>数量<input id="editQty" maxlength="30" placeholder="例：2個"></label><div class="edit-buttons"><button type="button" id="cancelEdit" class="secondary">キャンセル</button><button type="submit">保存する</button></div></form></dialog><p class="muted">Firestoreのルールで、登録した夫婦2人のUIDだけに読み書きを許可してください。共有コードだけではアクセス制限になりません。</p></main><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import {getFirestore,collection,addDoc,doc,setDoc,updateDoc,deleteDoc,onSnapshot,serverTimestamp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
const $=id=>document.getElementById(id),DAY=86400000;
let db,coll,favColl,unsub,unsubFav,records=[],favorites=[],auth,roomKey,undoState=null,undoTimer,editId=null,connecting=false;
let saved=null;try{saved=JSON.parse(localStorage.getItem('shopping-settings')||'null')}catch{}
if(saved){$('config').value=JSON.stringify(saved.config);$('room').value=saved.room}
function error(e){$('status').textContent='エラー: '+(e?.message||e);console.error(e)}
function showUndo(message,fn){undoState=fn;clearTimeout(undoTimer);$('undoText').textContent=message;$('undoToast').classList.remove('hidden');undoTimer=setTimeout(()=>{undoState=null;$('undoToast').classList.add('hidden')},10000)}
$('undoButton').onclick=async()=>{const fn=undoState;undoState=null;clearTimeout(undoTimer);$('undoToast').classList.add('hidden');if(fn)try{await fn()}catch(e){error(e)}};
const itemDoc=id=>doc(coll,id);
async function changeItem(r,patch,message){const previous=Object.fromEntries(Object.keys(patch).map(k=>[k,r[k]??null]));await updateDoc(itemDoc(r.id),patch);showUndo(message,()=>updateDoc(itemDoc(r.id),previous))}
async function removeItem(r){const {id,...data}=r;await deleteDoc(itemDoc(id));showUndo('商品を削除しました',()=>setDoc(itemDoc(id),data))}
function row(r){const div=document.createElement('div');div.className='line'+(r.boughtAt?' done':'');const check=document.createElement('input');check.type='checkbox';check.checked=!!r.boughtAt;check.setAttribute('aria-label',r.name+'の購入状態を切り替える');check.onchange=async()=>{check.disabled=true;try{await changeItem(r,{boughtAt:check.checked?Date.now():null},check.checked?'購入済みにしました':'未購入に戻しました')}catch(e){check.checked=!check.checked;error(e)}finally{check.disabled=false}};
const label=document.createElement('label');label.textContent=r.name;const qty=document.createElement('span');qty.className='qty';qty.textContent=r.qty||'';
const star=document.createElement('button');star.type='button';star.className='fav-action';star.textContent=favorites.some(x=>x.name===r.name)?'★':'☆';star.title='よく買うものに登録・解除';star.setAttribute('aria-label',r.name+'をよく買うものに登録・解除');star.onclick=()=>toggleFav(r.name);
const edit=document.createElement('button');edit.type='button';edit.className='mini-action';edit.textContent='編集';edit.onclick=()=>{$('editName').value=r.name;$('editQty').value=r.qty||'';editId=r.id;$('editDialog').showModal()};
const del=document.createElement('button');del.type='button';del.className='mini-action';del.textContent='削除';del.onclick=async()=>{if(confirm('この商品を削除しますか？'))try{await removeItem(r)}catch(e){error(e)}};
div.append(check,label,qty,star,edit,del);return div}
function render(){const now=Date.now(),pending=records.filter(r=>!r.boughtAt),recent=records.filter(r=>r.boughtAt&&now-r.boughtAt<DAY),history=records.filter(r=>r.boughtAt&&now-r.boughtAt>=DAY),total=pending.length+recent.length,percent=total?Math.round(recent.length/total*100):0;
$('progressPercent').textContent=percent+'%';$('progressFill').style.width=percent+'%';$('progressFill').setAttribute('aria-valuenow',String(percent));$('progressDetail').textContent=total?`${total}件中 ${recent.length}件 購入済み · 残り${pending.length}件`:'買うものを追加すると進捗が表示されます';$('count').textContent=`(${pending.length})`;
for(const [id,data] of [['pending',pending],['recent',recent],['history',history]]){const el=$(id);el.replaceChildren(...data.map(row));if(!data.length){const p=document.createElement('p');p.className='muted';p.textContent=id==='pending'?'買うものはありません':'該当する商品はありません';el.append(p)}}renderFav()}
function renderFav(){const box=$('quickList'),manager=$('favoriteRows');box.replaceChildren();manager.replaceChildren();if(!favorites.length){const span=document.createElement('span');span.className='muted';span.textContent='商品横の☆で登録できます';box.append(span)}for(const f of favorites){const chip=document.createElement('button');chip.type='button';chip.className='quick-btn';chip.textContent='＋ '+f.name;chip.title=f.name+'をリストに追加';chip.onclick=async()=>{chip.disabled=true;try{const name=f.name;if(records.some(r=>r.name===name&&!r.boughtAt)){showUndo('すでに買うものにあります',null);return}const newDoc=await addDoc(coll,{name,qty:f.qty||'',boughtAt:null,createdAtMs:Date.now(),createdAt:serverTimestamp()});showUndo(name+'を追加しました',()=>deleteDoc(newDoc))}catch(e){error(e)}finally{chip.disabled=false}};box.append(chip);
const line=document.createElement('div');line.className='favorite-row';const text=document.createElement('span');text.textContent=f.name;const btn=document.createElement('button');btn.className='secondary small';btn.textContent='解除';btn.onclick=()=>toggleFav(f.name);line.append(text,btn);manager.append(line)}}
async function toggleFav(name){try{const match=favorites.find(f=>f.name===name);if(match){const {id,...data}=match;await deleteDoc(doc(favColl,id));showUndo('定番から解除しました',()=>setDoc(doc(favColl,id),data))}else{const added=await addDoc(favColl,{name,createdAtMs:Date.now()});showUndo('よく買うものに登録しました',()=>deleteDoc(added))}}catch(e){error(e)}}
$('manageFav').onclick=()=>{$('favManager').classList.toggle('hidden');$('manageFav').textContent=$('favManager').classList.contains('hidden')?'編集':'閉じる'};
$('addFav').onclick=async()=>{const name=$('newFav').value.trim();if(!name)return;if(favorites.some(x=>x.name===name))return;await toggleFav(name);$('newFav').value=''};
$('newFav').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();$('addFav').click()}};
$('editForm').onsubmit=async e=>{e.preventDefault();const r=records.find(x=>x.id===editId);if(!r)return;const name=$('editName').value.trim(),qty=$('editQty').value.trim();if(!name)return;$('editDialog').close();try{await changeItem(r,{name,qty},'商品を編集しました')}catch(err){error(err)}};
$('cancelEdit').onclick=()=>{$('editDialog').close()};
async function connect(){if(connecting)return;connecting=true;try{const config=JSON.parse($('config').value),room=$('room').value.trim();if(!/^[a-zA-Z0-9_-]{16,100}$/.test(room))throw Error('共有コードは英数字・_-で16〜100文字にしてください');const firebaseApp=initializeApp(config);auth=getAuth(firebaseApp);db=getFirestore(firebaseApp);roomKey=room;localStorage.setItem('shopping-settings',JSON.stringify({config,room}));$('setup').classList.add('hidden');$('login').classList.remove('hidden');onAuthStateChanged(auth,user=>{if(unsub){unsub();unsub=null}if(unsubFav){unsubFav();unsubFav=null}if(user){$('login').classList.add('hidden');$('app').classList.remove('hidden');coll=collection(db,'shoppingLists',roomKey,'items');favColl=collection(db,'shoppingLists',roomKey,'favorites');unsub=onSnapshot(coll,snap=>{records=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.createdAtMs||0)-(b.createdAtMs||0));$('status').textContent='● 共有リストに接続中';render()},error);unsubFav=onSnapshot(favColl,snap=>{favorites=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.createdAtMs||0)-(b.createdAtMs||0));render()},error);render()}else{$('login').classList.remove('hidden');$('app').classList.add('hidden')}})}catch(e){$('setupError').textContent=e.message}finally{connecting=false}}
$('connect').onclick=connect;
$('signIn').onclick=async()=>{try{$('loginError').textContent='';await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value)}catch(e){$('loginError').textContent='ログインできません: '+e.code}};
$('add').onsubmit=async e=>{e.preventDefault();const name=$('item').value.trim();if(!name)return;const btn=$('add').querySelector('button');btn.disabled=true;try{const created=await addDoc(coll,{name,qty:$('quantity').value.trim(),boughtAt:null,createdAtMs:Date.now(),createdAt:serverTimestamp()});$('item').value='';$('quantity').value='';showUndo('商品を追加しました',()=>deleteDoc(created))}catch(err){error(err)}finally{btn.disabled=false}};
$('toggleHistory').onclick=()=>{$('history').classList.toggle('hidden');$('toggleHistory').textContent=$('history').classList.contains('hidden')?'購入履歴を表示':'購入履歴を閉じる'};
$('reset').onclick=()=>{if(confirm('接続設定を変更しますか？')){localStorage.removeItem('shopping-settings');location.reload()}};
setInterval(()=>{if(coll)render()},60000);
if(saved)connect();
</script></body></html>
